apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: demo-app-pipeline
serialPipeline:
  stages:
  # Stage 1: Dev - Auto-deploys to the live service
  - targetId: dev-env
    strategy:
      standard: {}

  # Stage 2: Prod - Requires manual approval, then uses a Canary strategy
  - targetId: prod-env
    strategy:
      canary:
        runtimeConfig:
          cloudRun:
            automaticTrafficControl: true
        canaryDeployment:
          # Route 10% of traffic to the new version first, then promote to 100%
          percentages: [10, 50]
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: dev-env
executionConfigs:
- usages:
  - RENDER
  - DEPLOY
  serviceAccount: cicd-pipeline-sa@cicd-devops-demos.iam.gserviceaccount.com
run:
  location: projects/cicd-devops-demos/locations/us-central1
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod-env
requireApproval: true
executionConfigs:
- usages:
  - RENDER
  - DEPLOY
  serviceAccount: cicd-pipeline-sa@cicd-devops-demos.iam.gserviceaccount.com
run:
  location: projects/cicd-devops-demos/locations/us-east1
