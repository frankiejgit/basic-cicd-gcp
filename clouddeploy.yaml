apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: demo-app-pipeline
serialPipeline:
  stages:
  # Stage 1: Dev - Auto-deploys and runs verification tests against the live service
  - targetId: dev-env
    strategy:
      standard:
        verify: true

  # Stage 2: Prod - Requires manual approval, then uses a Canary strategy
  - targetId: prod-env
    strategy:
      canary:
        runtimeConfig:
          cloudRun:
            automaticTrafficControl: true
        canaryDeployment:
          # Route 10% of traffic to the new version first, then promote to 100%
          percentages: [10, 50]
          verify: true
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: dev-env
executionConfigs:
- usages:
  - RENDER
  - DEPLOY
  - VERIFY
  serviceAccount: cicd-pipeline-sa@${PROJECT_ID}.iam.gserviceaccount.com
run:
  location: projects/${PROJECT_ID}/locations/us-central1
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod-env
requireApproval: true
executionConfigs:
- usages:
  - RENDER
  - DEPLOY
  - VERIFY
  serviceAccount: cicd-pipeline-sa@${PROJECT_ID}.iam.gserviceaccount.com
run:
  location: projects/${PROJECT_ID}/locations/us-east1
