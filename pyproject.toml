[project]
name = "basic-cicd-gcp"
version = "0.1.0"
description = "Basic CI/CD for GCP projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
