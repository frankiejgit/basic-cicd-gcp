apiVersion: skaffold/v4beta7
kind: Config
manifests:
  rawYaml:
    - service.yaml
deploy:
  cloudrun: {}
verify:
  - name: verify-health-check
    container:
      name: verify-health-check
      image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
      command: ["/bin/bash"]
      args:
        - "-c"
        - |
          set -e
          # 1. Parse service base URL and endpoint for private Cloud Run service
          RAW_URL=$(echo "$CLOUD_RUN_SERVICE_URLS" | cut -d',' -f1 | tr -d '[:space:]')
          BASE_URL=$(echo "$RAW_URL" | sed 's|/health.*$||' | sed 's|/*$||')
          ENDPOINT="${BASE_URL}/health"

          echo "Verifying private Cloud Run service:"
          echo "  Endpoint: $ENDPOINT"
          echo "  Audience: $BASE_URL"

          # 2. Retrieve OIDC Identity Token for private Cloud Run authentication
          TOKEN=$(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=${BASE_URL}" 2>/dev/null)
          if [ -z "$TOKEN" ] || [ "${#TOKEN}" -lt 50 ]; then
            TOKEN=$(gcloud auth print-identity-token --audiences="${BASE_URL}" 2>/dev/null || true)
          fi

          # 3. Poll the endpoint using the Bearer token
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" "$ENDPOINT")
            echo "Attempt $i: HTTP status = $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Verification PASSED! Service is healthy."
              exit 0
            fi
            sleep 5
          done

          echo "Verification FAILED! Service did not return 200 OK after 5 attempts."
          exit 1